# SOPS configuration — maps age public keys to secret files.
# Each teammate adds their age public key here.
#
# Generate your age keypair:
#   mkdir -p ~/.config/sops/age
#   age-keygen -o ~/.config/sops/age/keys.txt
#   age-keygen -y ~/.config/sops/age/keys.txt   # prints your PUBLIC key
#
# Then add your public key below and re-encrypt:
#   sops updatekeys secrets/secrets.yaml

keys:
  # Add each teammate's age public key here
  - &spadia age16xmkjfl7snuja43m0279wcakkk9vvwk33dv8vc4kdnwzmxuryags90c2gk

creation_rules:
  - path_regex: secrets/.*\.yaml$
    key_groups:
      - age:
          - *spadia
          # - *teammate1
          # - *teammate2
